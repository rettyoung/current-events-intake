name: Feed intake
on:
  schedule:
    - cron: "41 * * * *"     # hourly at :41 UTC, off GitHub's busy top of the hour
    - cron: "13 14,15 * * 1-5"  # extra weekday runs before the 07:28 PT digest (14:28 UTC in PDT, 15:28 in PST)
    # GitHub runs schedules best-effort and may delay or skip them; extra lines are extra chances.
  workflow_dispatch: {}      # Run workflow button in the Actions tab
permissions:
  contents: write
concurrency:
  group: intake
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        id: fetch
        run: python intake.py
      - name: Commit new items
        if: always() && steps.fetch.outcome != 'skipped'
        run: |
          git config user.name "intake-bot"
          git config user.email "intake-bot@users.noreply.github.com"
          git add items state
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "intake $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
